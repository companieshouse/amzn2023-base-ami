---
- hosts: amzn2023-base
  become: true
  roles:
    - role: companieshouse.security.package_overrides
      vars:
        package_overrides_list:
          - name: ca-certificates
            releasever: latest
            min_version: "2025.2.76" # placeholder until fix released
            reason: CVE-2026-113470 # note the fix isn't released yet, min_ver will be updated
    - role: required_packages
    - role: AMAZON2023-CIS
      tags:
        - level1-server
        - level2-server
        - automated
    - role: companieshouse.security.clamav_ng
    - role: ch_collections.base.cron_control
    - role: ch_collections.security_banner.banner
