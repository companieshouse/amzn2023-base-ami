---
- hosts: amzn2023-base
  become: true
  roles:
    - role: companieshouse.security.package_overrides
      vars:
        package_overrides_list:
          - name: ca-certificates
            releasever: latest
            min_version: "2025.2.76-1.0.amzn2023.0.4"
            reason: CVE-2026-113470 # https://alas.aws.amazon.com/AL2023/ALAS2023-2026-3306.html
    - role: required_packages
    - role: AMAZON2023-CIS
      tags:
        - level1-server
        - level2-server
        - automated
    - role: companieshouse.security.clamav_ng
    - role: ch_collections.base.cron_control
    - role: ch_collections.security_banner.banner
